// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    ext {

        release = [
                applicationId : "ebj.yujinkun.ramentracker",
                versionCode : 1,
                versionName : "1.0"
        ]

        buildVersions = [
                minSdk : 23,
                targetSdk : 31,
                compileSdk : 31
        ]

        dependencyVersions = [
                appCompat : "1.4.0",
                archCore : "2.1.0",
                atslCore : "1.4.0",    // atsl : android testing support library
                atslJunit : "1.1.3",
                atslRules : "1.4.0",
                atslRunner : "1.4.0",
                cardView : "1.0.0",
                constraintLayout : "2.1.2",
                coreKtx : "1.7.0",
                espresso : "3.4.0",
                flexbox : "3.0.0",
                glide : "4.12.0",
                googleAuth : "19.2.0",
                googleDrive : "17.0.0",
                gradle : "7.0.1",
                hilt : "2.38.1",
                junit : "4.13.2",
                kotlin : "1.5.31",
                lifecycle : "2.4.0",
                lifecycleExtensions : "2.2.0",
                material : "1.4.0",
                mockito : "2.8.9",
                navigation : "2.3.5",
                paging : "2.1.2",
                preference : "1.1.1",
                recyclerview : "1.2.1",
                room : "2.3.0",
                rxjava2 : "2.1.1",
                timber : "5.0.1",
        ]

    }

    repositories {
        google()
        mavenCentral()

    }

    dependencies {
        classpath "com.android.tools.build:gradle:$dependencyVersions.gradle"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.6.10"
        classpath "com.google.dagger:hilt-android-gradle-plugin:$dependencyVersions.hilt"
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:$dependencyVersions.navigation"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
