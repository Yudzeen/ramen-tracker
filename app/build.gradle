plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'dagger.hilt.android.plugin'
    id "androidx.navigation.safeargs"
}

apply from: "$rootDir/base-android-module.gradle"

android {

    buildTypes {
        release {
            minifyEnabled false
            debuggable true
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            testCoverageEnabled = true
        }
    }

    defaultConfig {
        applicationId release.applicationId
        versionCode release.versionCode
        versionName release.versionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Hilt
    kapt "com.google.dagger:hilt-compiler:$dependencyVersions.hilt"
    implementation "com.google.dagger:hilt-android:$dependencyVersions.hilt"

    // Room
    kapt "androidx.room:room-compiler:$dependencyVersions.room"
    api "androidx.room:room-runtime:$dependencyVersions.room"
    implementation "androidx.room:room-ktx:$dependencyVersions.room"
    implementation "androidx.room:room-rxjava2:$dependencyVersions.room"
    androidTestImplementation "androidx.room:room-testing:$dependencyVersions.room"

    // App dependencies
    implementation "androidx.appcompat:appcompat-resources:$dependencyVersions.appCompat"
    implementation "androidx.appcompat:appcompat:$dependencyVersions.appCompat"
    implementation "androidx.cardview:cardview:$dependencyVersions.cardView"
    implementation "androidx.core:core-ktx:$dependencyVersions.coreKtx"
    implementation "androidx.constraintlayout:constraintlayout:$dependencyVersions.constraintLayout"
    implementation "androidx.lifecycle:lifecycle-extensions:$dependencyVersions.lifecycleExtensions"
    implementation "androidx.lifecycle:lifecycle-reactivestreams-ktx:$dependencyVersions.lifecycle"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$dependencyVersions.lifecycle"
    implementation "androidx.navigation:navigation-fragment-ktx:$dependencyVersions.navigation"
    implementation "androidx.navigation:navigation-ui-ktx:$dependencyVersions.navigation"
    implementation "androidx.paging:paging-runtime:$dependencyVersions.paging"
    implementation "androidx.paging:paging-rxjava2:$dependencyVersions.paging"
    implementation "androidx.preference:preference-ktx:$dependencyVersions.preference"
    implementation "androidx.recyclerview:recyclerview:$dependencyVersions.recyclerview"
    implementation "com.github.bumptech.glide:glide:$dependencyVersions.glide"
    implementation "com.google.android.flexbox:flexbox:$dependencyVersions.flexbox"
    implementation "com.google.android.gms:play-services-auth:$dependencyVersions.googleAuth"
    implementation "com.google.android.gms:play-services-drive:$dependencyVersions.googleDrive"
    implementation "com.google.android.material:material:$dependencyVersions.material"
    implementation "com.jakewharton.timber:timber:$dependencyVersions.timber"
    implementation "io.reactivex.rxjava2:rxandroid:$dependencyVersions.rxjava2"
    implementation "io.reactivex.rxjava2:rxjava:$dependencyVersions.rxjava2"

    // Test dependencies
    testImplementation "androidx.arch.core:core-testing:$dependencyVersions.archCore"
    testImplementation "junit:junit:$dependencyVersions.junit"
    testImplementation "org.mockito:mockito-core:$dependencyVersions.mockito"

    // Android test dependencies
    androidTestImplementation "androidx.arch.core:core-runtime:$dependencyVersions.archCore"
    androidTestImplementation "androidx.arch.core:core-testing:$dependencyVersions.archCore"
    androidTestImplementation "androidx.test.espresso:espresso-core:$dependencyVersions.espresso"
    androidTestImplementation "androidx.test.ext:junit:$dependencyVersions.atslJunit"
    androidTestImplementation "androidx.test:core:$dependencyVersions.atslCore"
    androidTestImplementation "androidx.test:rules:$dependencyVersions.atslRules"
    androidTestImplementation "androidx.test:runner:$dependencyVersions.atslRunner"
    androidTestImplementation "org.mockito:mockito-android:$dependencyVersions.mockito"

}